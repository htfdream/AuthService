spring:
  application:
    name: AuthService

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USER:authuser}
    password: ${DB_PASSWORD:authpass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKeyForJWTThatIsAtLeast32CharactersLong}
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 604800
  password:
    argon2:
      iterations: 3
      memory: 65536
      parallelism: 1

server:
  port:8080

grpc:
  server:
    port: 9090

logging:
  level:
    com.gth.auth: DEBUG
    org.springframework: INFO